<script>
  // Theme picker
  (function(){
    const KEY = 'tdx-theme2';
    const saved = localStorage.getItem(KEY) || 't3';
    document.documentElement.setAttribute('data-theme', saved);
    localStorage.setItem('tdx_stn_board_view', '0'); // 0 = 出發 only
    document.addEventListener('DOMContentLoaded', () => {
      const wrap = document.getElementById('theme-swatches');
      if (!wrap) return;
      const mark = (t) => wrap.querySelectorAll('button').forEach(
        b => b.classList.toggle('active', b.dataset.theme === t));
      mark(saved);
      wrap.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-theme]');
        if (!b) return;
        const t = b.dataset.theme;
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem(KEY, t);
        mark(t);
      });
    });
  })();
</script>

<script>
  // Auto-show 出發站 live board on load + wire 即時 button.
  (function autoShowBoards() {
    // Inject "雙向版" link banner via JS (bypasses Flask template cache)
    const banner = document.createElement('div');
    banner.style.cssText = 'background:#1f6fb5;padding:8px 24px;text-align:center;border-bottom:2px solid #ffd24a';
    banner.innerHTML = '<a id="dual-link" href="/" title="切換到雙向版（出發/回程兩個方向）">⇆ 雙向版（含回程列表）</a>';
    const header = document.querySelector('header');
    if (header && header.nextSibling) header.parentNode.insertBefore(banner, header.nextSibling);

    const wrap = document.getElementById('station-live-wrap');
    if (wrap) wrap.style.display = 'block';
    const fromSelEl = document.getElementById('from-sel');
    const toSelEl   = document.getElementById('to-sel');
    const liveBtn   = document.getElementById('live-btn');
    if (liveBtn) liveBtn.addEventListener('click', () => {
      try { window.fetchStationBoards && window.fetchStationBoards(); } catch (e) {}
    });
    let tries = 0;
    function tryFetch() {
      tries++;
      const f = fromSelEl && fromSelEl.value;
      const t = toSelEl   && toSelEl.value;
      if (typeof window.fetchStationBoards === 'function' && f && t && f !== t) {
