<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ filename }}</title>
</head>
<body>
  <h1>{{ filename }}</h1>
  <p>Date: {{ date }}</p>
  <p>Version: {{ version }}</p>
  {% if filename == "chatgpt.html" %}
  <nav aria-label="Version formats">
    <a href="{{ url_for('chatgpt_version_html') }}">version.html</a>
    <a href="{{ url_for('chatgpt_version_text') }}">version.txt</a>
    <a href="{{ url_for('chatgpt_version_json') }}">version.json</a>
    <a href="{{ url_for('chatgpt_rain_page', StationID='C0AH70') }}">Rainfall station</a>
    <a href="{{ url_for('chatgpt_station_ids_page') }}">All station IDs</a>
  </nav>
  {% endif %}
</body>
</html>
